name: ci
on:
  push: { branches: ["**"] }
  pull_request:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: The public bundle must not contain the placement module
        run: |
          if grep -rlE "commitPlacement|NoConsentRecord|DESTINATION_LEGAL_BASIS" dist/; then
            echo "::error::Person-shaped placement code leaked into the public bundle."
            exit 1
          fi
          echo "Public bundle is clean."

      # The badges page claims no third-party request is ever made. Test the claim rather
      # than asserting it: this drives every route and fails on ANY cross-origin request.
      - name: No third-party requests at runtime
        run: |
          npx playwright install --with-deps chromium
          npm run preview &
          npx wait-on http://127.0.0.1:4173 -t 60000
          VITE_BASE=http://127.0.0.1:4173 node e2e/no-external-requests.mjs

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: REUSE licensing compliance
        uses: fsfe/reuse-action@v5
