version = 1
SPDX-PackageName = "exodus"
SPDX-PackageSupplier = "Exodus contributors"
SPDX-PackageDownloadLocation = "https://github.com/fernandoleyra/exodus"

# Documentation and research corpus.
[[annotations]]
path = ["**/package.json", "**/package-lock.json", "**/tsconfig.json", ".gitignore", "REUSE.toml",
        "**/*.yml", "**/*.ts", "**/*.tsx", "**/*.mjs", "**/*.css", "**/*.html", "**/*.json",
        "**/*.svg", "LICENSE", "CITATION.cff"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Exodus contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
[[annotations]]
path = ["docs/**", "README.md", "*.md"]
SPDX-FileCopyrightText = "Exodus contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# The committed snapshot mixes sources under DIFFERENT licences, so it cannot carry one
# identifier. The tabular derivatives are CC BY 4.0; the geometry is public domain and its
# authors expressly waive attribution, so labelling it CC BY would impose a condition they
# gave up. Splitting this was a real correction: the single blanket CC-BY-4.0 annotation
# misstated a third party's licence.
[[annotations]]
path = ["apps/web/public/snapshot/places.json", "apps/web/public/snapshot/corridors.json", "apps/web/public/snapshot/manifest.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "Thomas Gaskin and Guy J. Abel (Zenodo 10.5281/zenodo.17344747), CC BY 4.0",
  "Guy Abel (figshare 14579241), CC BY 4.0",
  "The World Bank, World Development Indicators, CC BY 4.0",
]
SPDX-License-Identifier = "CC-BY-4.0"

# The concordance snapshot is the one file that carries data from all five producers at
# once, and three of their licences are different instruments. Eurostat statistical data
# are NOT under the CC BY 4.0 that covers its website's editorial content, and IMF Data
# are carved out of an otherwise all-rights-reserved notice by special terms. Both are
# quoted verbatim in LICENSES/.
[[annotations]]
path = "apps/web/public/snapshot/concordance.json"
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "Thomas Gaskin and Guy J. Abel (Zenodo 10.5281/zenodo.17344747), CC BY 4.0",
  "Guy Abel (figshare 14579241), CC BY 4.0",
  "The World Bank, World Development Indicators, CC BY 4.0",
  "European Union, Eurostat (migr_imm1ctz, une_rt_a) — reuse under Commission Decision 2011/833/EU",
  "International Monetary Fund, World Economic Outlook database — IMF terms for statistical Data",
]
SPDX-License-Identifier = "CC-BY-4.0 AND LicenseRef-Eurostat-Reuse AND LicenseRef-IMF-Data"

[[annotations]]
path = "apps/web/public/snapshot/adm0.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "Natural Earth — public domain, no attribution required"
SPDX-License-Identifier = "LicenseRef-NaturalEarth-PublicDomain"

# Project configuration with no meaningful creative content.

# Package-level docs that the broad markdown rule does not reach.
[[annotations]]
path = ["apps/web/README.md", "apps/web/src/placement/README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Exodus contributors"
SPDX-License-Identifier = "CC-BY-4.0"
